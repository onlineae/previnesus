<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005DAA"/>
      <stop offset="100%" stop-color="#003865"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#00843D"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Glow -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.08"/>
  
  <!-- Inner White Shield / Heart Background -->
  <path d="M256 90 C340 90 400 150 400 230 C400 330 256 420 256 420 C256 420 112 330 112 230 C112 150 172 90 256 90 Z" fill="#ffffff"/>
  
  <!-- Green Medical Cross -->
  <path d="M226 150 H286 V206 H342 V266 H286 V322 H226 V266 H170 V206 H226 Z" fill="url(#crossGrad)" rx="12"/>
  
  <!-- Digital / Vision Pulse Ring -->
  <circle cx="256" cy="236" r="30" fill="none" stroke="#FFCC00" stroke-width="8" stroke-dasharray="10 5"/>
</svg>
